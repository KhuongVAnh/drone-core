<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone-Core | Test Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 24px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    .banner { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .banner h2 { font-size: 20px; color: #38bdf8; margin-bottom: 4px; }
    .banner p { font-size: 13px; color: #cbd5e1; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; margin-bottom: 24px; }
    .info-box { background: #0f172a; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; }
    .info-label { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; }
    .info-value { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-top: 4px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; }
    .btn:hover { background: #0369a1; }
    #ping-result { font-size: 12px; color: #38bdf8; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛸</div>
    <h1>DRONE-CORE SYSTEM</h1>
    <p class="subtitle">Raspberry Pi 4 Edge Companion Computer</p>

    <div class="banner">
      <h2>👋 Hello World!</h2>
      <p>Giao diện Web UI nội bộ đã hoạt động thành công trên thiết bị.</p>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">Trạng thái</div>
        <div class="info-value"><span class="badge">Online (HTTP 200)</span></div>
      </div>
      <div class="info-box">
        <div class="info-label">Thiết bị</div>
        <div class="info-value" id="dev-id">drone-edge-01</div>
      </div>
      <div class="info-box">
        <div class="info-label">Thời gian</div>
        <div class="info-value" id="clock">--:--:--</div>
      </div>
      <div class="info-box">
        <div class="info-label">Mạng nội bộ</div>
        <div class="info-value">192.168.4.1 / LAN</div>
      </div>
    </div>

    <button class="btn" onclick="testPing()">⚡ Test API Ping</button>
    <div id="ping-result"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('vi-VN');
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function testPing() {
      const resEl = document.getElementById('ping-result');
      resEl.textContent = 'Đang gửi ping...';
      try {
        const res = await fetch('/api/ping');
        const data = await res.json();
        resEl.textContent = `✓ Phản hồi từ Server: ${data.message} (${data.time})`;
      } catch (err) {
        resEl.textContent = '✗ Lỗi kết nối API!';
      }
    }
  </script>
</body>
</html>
